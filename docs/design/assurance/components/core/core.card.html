<!-- @dsCard group="Components" viewport="700x330" subtitle="Buttons, badges, inputs, filter tabs" name="Core" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css"><link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css"></head>
<body style="margin:0;padding:20px 24px;background:var(--surface-canvas);font-family:var(--font-sans);color:var(--text-body)">
<div style="display:flex;flex-direction:column;gap:16px">
<div style="display:flex;flex-wrap:wrap;gap:8px"><button style="display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 16px;border-radius:var(--radius-sm);font:500 14px/1 var(--font-sans);background:var(--brand);color:var(--text-on-brand);border:1px solid var(--brand)">Continue assessment<i class="ph ph-arrow-right"></i></button><button style="display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 16px;border-radius:var(--radius-sm);font:500 14px/1 var(--font-sans);background:var(--surface-card);color:var(--brand);border:1px solid var(--border-strong)">Export view (6)</button><button style="display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 16px;border-radius:var(--radius-sm);font:500 14px/1 var(--font-sans);background:transparent;color:var(--text-body);border:1px solid transparent">Cancel</button><button style="display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 16px;border-radius:var(--radius-sm);font:500 14px/1 var(--font-sans);background:var(--status-gap-ink);color:#fff;border:1px solid var(--status-gap-ink)">Revoke approval</button><button style="display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 16px;border-radius:var(--radius-sm);font:500 14px/1 var(--font-sans);background:var(--seal);color:#fff;border:1px solid var(--seal)"><i class="ph ph-seal-check"></i> Sign off</button></div>
<div style="display:flex;flex-wrap:wrap;gap:8px"><span style="display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 8px;border-radius:2px;background:var(--status-effective-bg);color:var(--status-effective-ink);font:500 12px/1 var(--font-sans)"><span style="width:6px;height:6px;border-radius:50%;background:currentColor"></span>Effective</span><span style="display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 8px;border-radius:2px;background:var(--status-partial-bg);color:var(--status-partial-ink);font:500 12px/1 var(--font-sans)"><span style="width:6px;height:6px;border-radius:50%;background:currentColor"></span>Partial</span><span style="display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 8px;border-radius:2px;background:var(--status-gap-bg);color:var(--status-gap-ink);font:500 12px/1 var(--font-sans)"><span style="width:6px;height:6px;border-radius:50%;background:currentColor"></span>Gap</span><span style="display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 8px;border-radius:2px;background:var(--status-untested-bg);color:var(--status-untested-ink);font:500 12px/1 var(--font-sans)"><span style="width:6px;height:6px;border-radius:50%;background:currentColor"></span>Not tested</span><span style="display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 8px;border-radius:2px;background:var(--seal-soft);color:var(--seal-ink);font:500 12px/1 var(--font-sans)"><span style="width:6px;height:6px;border-radius:50%;background:currentColor"></span>Attested</span><span style="display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:2px;background:var(--risk-high-bg);color:var(--risk-high-ink);font:var(--text-overline);letter-spacing:.1em;text-transform:uppercase">High-risk</span><span style="display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:2px;background:var(--risk-limited-bg);color:var(--risk-limited-ink);font:var(--text-overline);letter-spacing:.1em;text-transform:uppercase">Limited</span><span style="display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:2px;background:var(--risk-prohibited-bg);color:var(--risk-prohibited-ink);font:var(--text-overline);letter-spacing:.1em;text-transform:uppercase">Prohibited</span></div>
<div style="display:grid;grid-template-columns:1.4fr 1fr;gap:12px">
<label style="display:flex;flex-direction:column;gap:6px"><span style="font:var(--text-label);color:var(--text-strong)">System name</span><span style="display:flex;align-items:center;gap:8px;height:40px;padding:0 12px;background:var(--surface-card);border:1px solid var(--border-input);border-radius:var(--radius-sm);color:var(--text-muted)"><i class="ph ph-magnifying-glass"></i><span style="color:var(--text-subtle)">Search systems, owners, vendors…</span></span></label>
<label style="display:flex;flex-direction:column;gap:6px"><span style="font:var(--text-label);color:var(--text-strong)">Owner</span><span style="display:flex;align-items:center;height:40px;padding:0 12px;background:var(--surface-card);border:1px solid var(--status-gap-ink);border-radius:var(--radius-sm)">—</span><span style="font:var(--text-caption);color:var(--status-gap-ink)">Name an accountable owner to submit.</span></label></div>
<div style="display:inline-flex;gap:4px;padding:3px;background:var(--surface-sunken);border-radius:var(--radius-sm);width:max-content"><span style="display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 12px;border-radius:2px;background:var(--surface-card);box-shadow:var(--shadow-1);color:var(--text-strong);font:500 13px/1 var(--font-sans)">All<span style="font:var(--text-code);font-size:11px;color:var(--brand)">6</span></span><span style="display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 12px;border-radius:2px;color:var(--text-muted);font:500 13px/1 var(--font-sans)">High-risk<span style="font:var(--text-code);font-size:11px;color:var(--text-subtle)">2</span></span><span style="display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 12px;border-radius:2px;color:var(--text-muted);font:500 13px/1 var(--font-sans)">Limited<span style="font:var(--text-code);font-size:11px;color:var(--text-subtle)">2</span></span><span style="display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 12px;border-radius:2px;color:var(--text-muted);font:500 13px/1 var(--font-sans)">Minimal<span style="font:var(--text-code);font-size:11px;color:var(--text-subtle)">2</span></span><span style="display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 12px;border-radius:2px;color:var(--text-muted);font:500 13px/1 var(--font-sans)">Prohibited<span style="font:var(--text-code);font-size:11px;color:var(--text-subtle)">0</span></span></div>
</div></body></html>
