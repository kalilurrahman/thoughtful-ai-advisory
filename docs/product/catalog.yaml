      - id: S16.2
        persona: cro
        want: an EU AI Act readiness checker
        so_that: I can screen my role and obligation areas without a legal determination
        status: planned
        acceptance:
          - Given the page today, when visited, then it describes role screening and obligation areas and offers a waitlist form.
        routes: [/tools/eu-ai-act-readiness-checker]
      - id: S16.3
        persona: gov-lead
        want: real evidence upload, several workspaces and team roles
        so_that: the workspace supports an organisation, not one person
        status: planned
        acceptance:
