use_cases:
  - id: UC01
    title: Evaluate VERITRAIL from the website
    actors: [visitor]
    goal: Understand the framework, solutions and position on compliance claims.
    preconditions: [None — public pages.]
    flow:
      - Open the home page; read the problem, six layers and five pillars.
      - Follow a pillar or solution card to its page; use "On this page" to jump to sections.
      - Hover or tap underlined terms for definitions; open a cited control.
      - Read the compliance guide and its disclaimer.
    alternatives:
      - Use search (⌘K or "/") to jump straight to a topic.
      - Open Appearance to read in another theme, mode or font.
    outcome: The visitor knows what VERITRAIL does and does not claim.
    stories: [S01.1, S01.2, S01.3, S01.4, S15.3, S15.4, S15.6]
  - id: UC02
    title: Run the maturity self-assessment
    actors: [gov-lead]
    goal: Get an indicative maturity baseline and a 30/60/90-day plan.
    preconditions: [None.]
    flow:
      - Enter the organisation profile.
      - Answer 24 questions over eight domains.
      - Review the free preliminary result (score, level, domain bars).
      - Submit name, business email and organisation with consent to unlock the detailed report.
      - Download the report as Markdown or PDF.
    alternatives:
      - Free-mail address — refused with a request for a business email.
      - Service unreachable — report shown with a notice that nothing was saved or emailed.
    outcome: A User-asserted report; an assessment lead with qualification tags (no raw answers).
    stories: [S03.1, S03.2, S04.2]
  - id: UC03
    title: Triage an AI use case
    actors: [owner]
    goal: Get a suggested risk tier and the review path.
    preconditions: [None.]
    flow:
      - Describe the use case and answer the intake.
      - Review tier, factor points, triggers and missing facts.
      - Note the approval authority and review cadence.
    alternatives:
      - Prohibited-practice keywords — Prohibited-review, "stop and get legal review".
    outcome: An Inferred tier that an approver must confirm.
    stories: [S03.3]
  - id: UC04
    title: Draft runtime guardrails for an LLM app or agent
    actors: [ciso, engineer]
    goal: Produce a draft policy-as-code and permission matrix.
    preconditions: [None.]
    flow:
      - Describe the application, tools, data and autonomy.
      - Review the rating, permission matrix, approval rules and limits.
      - Download the draft policy and advisor report.
    outcome: A draft policy in Observe mode, ready for engineering review and testing in the simulator.
    stories: [S03.4, S13.2]
  - id: UC05
    title: Ask a governance question
    actors: [visitor, consultant]
    goal: Get a cited answer.
    preconditions: [None.]
    flow:
      - Ask a question or choose a suggestion.
      - Read the answer and follow cited controls.
    alternatives:
      - Unsafe request (injection, approval bypass, compliance determination) — refused with the reason.
    outcome: A deterministic, cited answer with no data sent anywhere.
    stories: [S03.5]
  - id: UC06
    title: Book a Governance Baseline or request a demo
    actors: [visitor, admin]
    goal: Start a commercial conversation.
    preconditions: [None.]
    flow:
      - Open the booking or demo page and complete the form with a business email and consent.
      - The submission is stored; if configured, it is pushed to the CRM.
      - An administrator reviews it in the admin console.
    alternatives:
      - Network failure — the form says nothing was recorded.
    outcome: A stored lead visible to administrators.
    stories: [S04.1, S04.2, S14.1]
  - id: UC07
    title: Look up a control or a term
    actors: [auditor, gov-lead]
    goal: Find a control's evidence and mappings, or a definition.
    preconditions: [None.]
    flow:
      - Press ⌘K and type a control ID (IS-11) or a term (kill switch).
      - Open the control page or glossary entry.
    outcome: The reader has the control's evidence examples and mappings, or the definition and related controls.
    stories: [S02.1, S02.2, S15.3, S15.4]
  - id: UC08
    title: Install VERITRAIL and read offline
    actors: [visitor, gov-lead]
    goal: Use VERITRAIL as an app, including without a connection.
    preconditions: [The published HTTPS site.]
    flow:
      - Read two pages; accept the install card or use the header button.
      - Follow the browser dialog or the step-by-step instructions.
      - Launch from the home screen; use a shortcut.
      - Go offline and reopen pages read earlier.
    outcome: An installed app with offline reading of visited pages.
    stories: [S15.1, S15.2]
  - id: UC09
    title: Assess the workspace with TILLER
    actors: [gov-lead]
    goal: Score the 12 controls with evidence.
    preconditions: [Demo workspace, or signed in for a private one.]
    flow:
      - Step through each control; set the score and evidence status; add a URL or note.
      - Read the guidance and rubric where needed.
      - Finish and view the release gate.
    outcome: Pillar scores and the VERITRAIL Index reflect evidenced practice.
    stories: [S05.1, S05.2]
  - id: UC10
    title: Check release readiness and plan remediation
    actors: [approver, gov-lead]
    goal: Decide whether the workspace can release at its tier.
    preconditions: [An assessment.]
    flow:
      - Open release readiness; read the gate status and pillar floors.
      - Open blocking controls; choose "Create remediation plan".
      - Track the items on the roadmap and the lifecycle checklist.
    outcome: Blockers become owned roadmap items.
    stories: [S05.3, S09.1, S09.2]
  - id: UC11
    title: Register an AI system
    actors: [owner, gov-lead]
    goal: Add a system to the inventory with a triage.
    preconditions: [None.]
    flow:
      - Open "Register & triage"; enter details and the triage answers.
      - Review the live result and save.
      - The record stays Under review until a human confirms it.
    outcome: An owned, classified inventory record with its rationale.
    stories: [S06.1, S06.2]
  - id: UC12
    title: Configure guardrails by tier
    actors: [ciso]
    goal: Close runtime control gaps.
    preconditions: [None.]
    flow:
      - Choose the workspace tier.
      - Switch on required guardrails; watch coverage.
    outcome: Coverage of required guardrails at the chosen tier.
    stories: [S07.1]
  - id: UC13
    title: Handle an AI incident
    actors: [owner, gov-lead]
    goal: Triage, contain and close an incident with history.
    preconditions: [None.]
    flow:
      - Log the incident with severity, category, system and owner.
      - Move it through Triage, Contained, Resolved and Closed; record response notes.
      - Raise a corrective action if needed.
    outcome: A closed incident with a full status history.
    stories: [S08.1, S08.5]
  - id: UC14
    title: Record a governance decision
    actors: [approver]
    goal: Approve, conditionally approve, accept risk, reject, pause or retire a system.
    preconditions: [A registered system.]
    flow:
      - Choose the system and disposition; enter rationale, conditions and review-by date.
      - Save; the previous decision is superseded.
      - If a record was entered wrongly, correct it with a reason; if it was made in error, withdraw it with a reason. The original stays in the register either way.
    outcome: A current decision with a review date, and a register that keeps every earlier record.
    stories: [S08.2]
  - id: UC15
    title: Review a material change
    actors: [owner, approver]
    goal: Screen a change before it ships.
    preconditions: [A registered system.]
    flow:
      - Submit the change with categories and impact ratings.
      - The reviewer records the outcome; High or Critical impacts escalate.
    outcome: An approved, rejected or implemented change with the reviewer's note.
    stories: [S08.3]
  - id: UC16
    title: Monitor a system and act on a breach
    actors: [engineer, owner]
    goal: Keep thresholds under review.
    preconditions: [A registered system.]
    flow:
      - Define a plan with metric, threshold, direction and cadence.
      - Record observations; a crossing shows Breach.
      - Follow the link to log an incident.
    outcome: Monitoring evidence and incident follow-up.
    stories: [S08.4, S08.1]
  - id: UC17
    title: Close a corrective action with verification
    actors: [owner, approver]
    goal: Prove a fix works.
    preconditions: [An action.]
    flow:
      - Start work; submit for verification with evidence.
      - The verifier closes it as effective, or returns it to work.
    outcome: A closed action with who verified and when.
    stories: [S08.5]
  - id: UC18
    title: Produce an evidence pack
    actors: [auditor, gov-lead]
    goal: Share the workspace position in a document.
    preconditions: [Workspace data.]
    flow:
      - Choose the pack and format; generate; download.
    outcome: A labelled preview document with blank sign-off.
    stories: [S11.1]
  - id: UC19
    title: Sign in and save a workspace
    actors: [gov-lead]
    goal: Keep a private workspace.
    preconditions: [An account.]
    flow:
      - Sign in; the demo state is cleared and the saved workspace loads.
      - Work; choose Save on the More screen.
    alternatives:
      - Load error — retry with Restore.
    outcome: A saved snapshot scoped to the user's organisation.
    stories: [S12.1, S12.2]
  - id: UC20
    title: Turn a concern into actions with the advisor
    actors: [gov-lead]
    goal: Map a concern to controls and tracked actions.
    preconditions: [The AI gateway is configured.]
    flow:
      - Choose a focus and describe the concern.
      - Review mapped controls and actions; add them as corrective actions.
    outcome: New corrective actions with due dates.
    stories: [S10.6, S08.5]
  - id: UC21
    title: Use the Agent console with approvals
    actors: [gov-lead, approver]
    goal: Run governed assistance with separation of duties.
    preconditions: [None — synthetic data.]
    flow:
      - Choose a chat identity and an approving identity.
      - Assess a use case; generate the gap register and report.
      - Approve or reject requests; verify the audit chain.
    outcome: Reports and an audit log demonstrating approvals and refusals.
    stories: [S13.1]
  - id: UC22
    title: Simulate runtime policy
    actors: [engineer, ciso]
    goal: See how a policy decides before deployment.
    preconditions: [None.]
    flow:
      - Choose a policy pack or paste a policy; set the rollout mode.
      - Run a scenario or custom event; inspect the decision and log.
    outcome: A verified, downloadable decision log.
    stories: [S13.2]
  - id: UC23
    title: Rehearse a pilot and estimate ROI
    actors: [consultant, cro]
    goal: Show the method end to end and its business case.
    preconditions: [None.]
    flow:
      - Run the pilot rehearsal and download its outputs.
      - Enter ROI inputs and compare scenarios.
    outcome: Rehearsal artefacts and an ROI estimate with labelled hypotheses.
    stories: [S13.3, S13.4, S13.5]
  - id: UC24
    title: Review leads and the funnel
    actors: [admin]
    goal: Follow up leads and understand conversion.
    preconditions: [Signed in and listed in site_admins.]
    flow:
      - Open the admin console; review leads and form submissions; download CSV.
      - Read the funnel and CTA clicks; verify an audit file.
    outcome: Prioritised follow-up and funnel insight.
    stories: [S14.1, S14.2]

