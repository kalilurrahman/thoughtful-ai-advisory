          - Given sign-in, when it succeeds, then the demo state is cleared and my saved workspace loads.
        routes: [/auth, /reset-password, /onboarding]
        gaps: [No SSO/SAML or MFA.]
      - id: S12.2
        persona: gov-lead
        want: to save and restore my workspace, with my team, without losing work
        so_that: my work survives across devices and nobody overwrites a colleague
        status: done
        acceptance:
          - Given I am signed in, when I choose Save, then the whole workspace is written in one call scoped to my organisation by RLS.
          - Given a saved workspace and an editing role, when I stop changing it for a moment, then it saves automatically and says whether all changes are saved.
          - Given a teammate saved a newer version, when my save arrives, then nothing is overwritten, autosave stops and I am told to restore their version.
          - Given unsaved edits, when I try to leave the page, then the browser asks me to confirm.
          - Given I choose Restore, when it loads, then the saved snapshot replaces the in-memory state.
        routes: [/more]
        tests: [autosave.test.ts, autosave-provider.test.tsx]
        gaps: [Save calls save_veritrail_workspace and falls back to save_aegis_workspace until migration 0009 is applied; conflict detection needs migration 0013.]
      - id: S12.3
        persona: visitor
        want: to see the plans and what each includes
        so_that: I understand the commercial options
        status: partial
        acceptance:
          - Given the plans page, when loaded, then the Free, Team, Business and Enterprise plans from src/data/plans.ts and the Governance Baseline are shown, with no unapproved price figures.
        routes: [/plans]
      - id: S12.4
        persona: gov-lead
        want: to buy, renew, change or cancel a self-serve plan
        so_that: my team gets the limits it needs without a sales call
        status: partial
        acceptance:
          - Given I am signed in on the Free plan, when I choose Team or Business, then a Dodo Payments checkout opens for the configured product and nothing is charged by VERITRAIL itself.
          - Given a signed Dodo webhook for a subscription, when received, then the subscription is stored once, older events never overwrite newer ones, and unsigned or stale requests change nothing.
          - Given an active or past-due subscription, when the plan is read on the server, then its limits apply (for example the advisor allowance); any other status means the Free plan.
          - Given a paid plan, when I choose Manage billing, then the Dodo customer portal opens to update payment, change or cancel.
        routes: [/plans]
        capabilities: [CAP-078]
        tests: [billing.test.ts, plans.test.ts]
        gaps: [Needs a Dodo Payments account, products and webhook secret (DODO_* settings)., Seat, system and workspace limits are defined but not yet enforced; only the advisor allowance is.]
      - id: S12.5
        persona: gov-lead
        want: to invite colleagues to my workspace with a role
        so_that: the governance team works from one record, with approvers and viewers free
        status: done
        acceptance:
          - Given I am the owner or an admin, when I invite an e-mail address with a role, then a single-use link valid for 14 days is created and I am told no e-mail was sent.
          - Given an operator or admin invitation, when the owner's plan has no free operator seat, then nothing is created and the message says how to proceed; approver and viewer invitations are always allowed.
          - Given an invitation link, when accepted by a signed-in user with the invited e-mail address, then they join with that role; any other address, a used, revoked or expired link adds nobody.
          - Given a member's role, when operator, admin or owner, then they can save the workspace; approvers and viewers read it and the database refuses their writes.
          - Given the owner or an admin, when they change a role or remove a member, then the owner can never be changed or removed and an admin cannot change another admin.
          - Given I belong to several workspaces, when I choose one, then it opens with my role shown.
        routes: [/invite, /more]
        capabilities: [CAP-079]
        tests: [team.test.ts]
        gaps: [Invitations are not e-mailed until an e-mail provider is added., Approvers cannot yet record approvals, because the workspace saves as one snapshot.]

  - id: E13
    title: Platform console
    area: platform
    goal: Run every Python platform capability in the browser as parity-tested TypeScript ports.
    status: demo
    stories:
      - id: S13.1
        persona: gov-lead
        want: to use the VERITRAIL Agent with roles, approvals and an audit log
        so_that: I can see governed AI assistance end to end
        status: done
        acceptance:
          - Given a sensitive action (tier change, exception, policy activation, evidence export, external send), when requested, then it waits for a human approval.
          - Given an approver, when resolving their own request, then it is refused and the attempt is audited.
          - Given the audit log, when verified, then the hash chain checks out.
        routes: [/platform/agent]
        tests: [platform-agent.test.ts, platform-audit.test.ts]
        gaps: [Synthetic data only; approvals have no external effect.]
      - id: S13.2
        persona: engineer
        want: to evaluate prompts, responses and tool calls against a policy pack in any rollout mode
        so_that: I can test policy-as-code before deployment
        status: done
        acceptance:
          - Given an event and policy, when evaluated, then the decision, reasons, matched rules, findings and redacted payload are shown and logged.
          - Given REQUIRE_HUMAN_APPROVAL, when an approver approves, then the event is re-run once with that approval.
        routes: [/platform/policy-simulator]
        tests: [platform-policy-engine.test.ts]
      - id: S13.3
        persona: consultant
        want: to rehearse a pilot end to end and download its outputs
        so_that: I can show the full method on realistic data
        status: done
        acceptance:
          - Given the rehearsal, when run, then it registers systems, tiers them with approvals, finds gaps, drafts policies and produces an approval-gated evidence pack and an audit chain.
        routes: [/platform/pilot-rehearsal]
        tests: [platform-pilot.test.ts]
      - id: S13.4
        persona: cro
        want: to estimate ROI with clearly labelled hypotheses
        so_that: the business case is honest about what is unmeasured
        status: done
        acceptance:
          - Given inputs, when calculated, then each line item shows its formula, and effect sizes are marked hypotheses with conservative, base and optimistic scenarios.
        routes: [/platform/roi-calculator]
        tests: [platform-misc-parity.test.ts, platform-samples.test.ts]
      - id: S13.5
        persona: consultant
        want: to browse and download the sample reports
        so_that: buyers see real outputs
        status: done
        acceptance:
          - Given the default date, when generated, then the samples match the committed Python outputs exactly.
        routes: [/platform/samples]
        tests: [platform-samples.test.ts]
      - id: S13.6
        persona: gov-lead
        want: to run the content checks in the browser
        so_that: governed content stays valid and free of prohibited claims
        status: done
        acceptance:
          - Given the bundled content, when checked, then each of the six steps passes or lists its failures.
        routes: [/platform/content-checks]
        tests: [platform-content-checks.test.ts]
      - id: S13.7
        persona: engineer
        want: to see every platform module, what it does, where it runs and the Python code it replaces
        so_that: I can trust that the browser tools match the reference platform
        status: done
        acceptance:
          - Given the console index, when it loads, then each module shows its summary, whether it runs in the browser or on the server, and the Python files it replaces.
          - Given a module name that does not exist, when opened, then the not-found page is shown.
        routes: [/platform]
        tests: [app-routing.test.tsx]

  - id: E14
    title: Administration and privacy-first analytics
    area: admin
    goal: Give administrators leads, submissions and the funnel, using cookieless analytics and membership-checked access.
    status: live
    stories:
      - id: S14.1
        persona: admin
        want: to review assessment leads and other form submissions, and download leads as CSV
        so_that: sales can follow up
        status: done
        acceptance:
          - Given I am signed in but not in site_admins, when I open the console, then I see the grant needed, not the data.
          - Given I am an admin, when the console loads, then every server read re-checks membership before using the service role.
          - Given the membership check fails or finds no row, when an admin function runs, then it refuses before using the service role.
        routes: [/platform/admin]
        tests: [platform-misc-admin.test.tsx, server-logic.test.ts]
      - id: S14.2
        persona: admin
        want: to see the funnel from page view to report download, and CTA clicks
        so_that: I know where visitors drop off
        status: done
        capabilities: [CAP-068]
        acceptance:
          - Given Do Not Track or Global Privacy Control, when set, then no event is sent.
          - Given an event, when sent, then only its name, path and sanitised props are stored — no cookies, IP or identifiers.
          - Given a site call to action, when clicked, then a cta_click event names it (hero, header, menu and CTA blocks).
          - Given a risk triage, guardrail draft or Ask answer, when produced, then a tool_use event names the tool and its tier, rating or intent (as the Python site).
        routes: [/platform/admin]
        tests: [platform-misc-parity.test.ts, site-analytics-events.test.tsx]

  - id: E15
    title: Installable app, search and reading experience
    area: app
    goal: Make the site an installable, offline-capable app that is easy to search and read.
    status: live
    stories:
      - id: S15.1
        persona: visitor
        want: to install VERITRAIL on my phone or desktop
        so_that: I can open it in one tap
        status: done
        capabilities: [CAP-070]
        acceptance:
          - Given Chrome, Edge or Samsung Internet, when installable, then the install card (after two pages or 40 s) and header button open the browser's dialog.
          - Given iPhone, iPad or Safari 17+ on Mac, when I choose "Show me how", then step-by-step instructions are shown.
          - Given "Not now", when chosen, then the card stays away for 14 days.
        tests: [pwa.test.ts]
      - id: S15.2
        persona: visitor
        want: to read pages I have opened while offline
        so_that: I can keep reading without a connection
        status: done
        capabilities: [CAP-071]
        acceptance:
          - Given a page I opened online, when offline, then it opens from the device; an unopened page shows the offline page with saved pages listed.
          - Given sign-in pages, server functions or URLs with query strings, when requested, then they are never cached.
          - Given a Lovable preview, iframe, development or localhost, when loaded, then no service worker registers.
        tests: [pwa.test.ts]
      - id: S15.3
        persona: visitor
        want: to search everything with one box
        so_that: I can jump to any page, control, term, workspace screen or tool
        status: done
        capabilities: [CAP-072]
        acceptance:
          - Given ⌘K, Ctrl+K or "/", when pressed, then the search opens from any page.
          - Given a control ID such as "is11", when searched, then that control is the first result.
          - Given results, when shown, then they are grouped by kind in order of best match.
        tests: [search.test.ts]
      - id: S15.4
        persona: visitor
        want: plain-language definitions of governance terms
        so_that: I can follow pages without prior knowledge
        status: done
        capabilities: [CAP-073]
        acceptance:
          - Given a glossary term in page text, when it is the first mention on the page, then it is underlined and shows its definition on hover, focus or tap.
          - Given the glossary page, when filtered by text or topic, then matching terms are listed with related controls.
        routes: [/glossary]
        tests: [site-reading.test.ts, search.test.ts]
      - id: S15.5
        persona: gov-lead
        want: the workspace header to fit on one row on every device
        so_that: actions do not overlap the page title
        status: done
        capabilities: [CAP-076]
        acceptance:
          - Given any width from 360 px, when the workspace loads, then the header controls stay on one row; on phones theme, export, search and install sit in a "More actions" menu.
          - Given the smoke test, when run, then a header that wraps fails the build.

      - id: S15.6
        persona: visitor
        want: to choose a colour theme, a mode (Auto, light or dark) and a font
        so_that: VERITRAIL is comfortable to read and feels like my own tools
        status: done
        capabilities: [CAP-077]
        acceptance:
          - Given the Appearance panel (website header or menu, workspace header, menu or More screen), when I pick Broadsheet, Midnight Gold or Financial Slate, Auto, light or dark, and Editorial serif, KR Tools or Modern sans, then the whole site and workspace restyle at once.
          - Given Auto, the default until I choose, when my device switches between light and dark, then the page follows it straight away; choosing Light or Dark stops following.
          - Given a saved choice, when any page loads, then it is applied before the first paint, with a matching browser colour, and other open tabs follow.
          - Given any palette and mode, when checked, then text, links and buttons meet WCAG AA contrast.
          - Given the KR Tools or Modern sans font, when either header is shown at 1280 px or 390 px, then it stays on one row.
        tests: [theme.test.ts]

  - id: E16
