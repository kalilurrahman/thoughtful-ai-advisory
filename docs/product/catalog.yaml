# VERITRAIL product catalog — the single source for the capabilities index, epics and user
# stories, and use cases in docs/product/. Edit this file, then run:
#
#   node scripts/build-product-docs.mjs
#
# Website content pages are added to the capabilities index automatically from
# platform/content/website_pages, so only apps, tools and features are listed here.
# src/test/product-catalog.test.ts fails when a route or tool has no capability here, when a
# capability is not delivered by any story, or when the generated docs are out of date.
#
# Stories link to capabilities through their routes (a website page resolves to its tool or to
# the content-page capability) and through an optional capabilities list for site-wide features.
#
# status:  live      works for real (data is real or computed from the user's input)
#          demo      works end to end on synthetic or sample data, in the browser
#          preview   produces output that is labelled a preview / not a signed export
#          planned   designed and announced (waitlist), not built
# data:    where state lives — none · session (sessionStorage) · browser (localStorage) ·
#          memory (lost on reload) · cloud (Supabase, RLS) · server (server function)
version: 1.0.0
updated: 2026-10-24

personas:
  - id: visitor
    name: Prospective buyer
    summary: Evaluates VERITRAIL; reads the framework and guides, runs the free tools, may book a baseline.
  - id: gov-lead
    name: AI governance lead
    summary: Runs the AI governance programme or CoE; owns the inventory, assessments, roadmap and reporting.
  - id: owner
    name: AI system owner
    summary: Business or product owner of an AI use case; registers it, answers triage and fixes gaps.
  - id: approver
    name: Approver
    summary: AI Risk Lead, AI Governance Forum or Legal; confirms tiers, approves releases, accepts risk.
  - id: ciso
    name: CISO / security architect
    summary: Accountable for LLM and agent risk; designs runtime guardrails, kill switch and logging.
  - id: engineer
    name: Engineering / platform lead
    summary: Implements policy-as-code, tool permissions and monitoring for AI applications and agents.
  - id: cro
    name: Chief Risk / Compliance Officer
    summary: Needs a defensible risk position, readiness evidence and indicative framework mappings.
  - id: auditor
    name: Internal auditor / assessor
    summary: Tests controls and evidence; needs tamper-evident records and evidence packs.
  - id: consultant
    name: Consultant / advisor
    summary: Uses the method, templates and agent to run governance work for clients.
  - id: admin
    name: Site administrator
    summary: VERITRAIL sales or marketing operations; reviews leads, form submissions and the funnel.

areas:
  - {id: site, name: Public website and content}
  - {id: tools, name: Free interactive tools}
  - {id: leads, name: Lead capture}
  - {id: assess, name: Workspace — assessment and release readiness}
  - {id: register, name: Workspace — AI inventory}
  - {id: operate, name: Workspace — operational governance}
  - {id: guide, name: Workspace — guidance and knowledge}
  - {id: report, name: Workspace — reports and evidence}
  - {id: account, name: Accounts and persistence}
  - {id: platform, name: Platform console}
  - {id: admin, name: Administration and analytics}
  - {id: app, name: Installable app, search and reading}

epics:
  - id: E01
    title: Public website and governed content
    area: site
    goal: >-
      Explain VERITRAIL's framework, solutions, compliance position and industry guidance from one
      governed Markdown source that the Python platform and the React site share.
    status: live
    stories:
      - id: S01.1
        persona: visitor
        want: to read what VERITRAIL is, the problem it solves and how it works on the home page
        so_that: I can decide quickly whether it fits my organisation
        status: done
        acceptance:
          - Given the home page, when it loads, then it shows the headline, two primary actions and counts of controls, pillars, layers and assessment questions taken from the content.
          - Given the home Markdown changes shape, when a section no longer matches its layout, then the section still renders as plain Markdown.
        routes: [/]
        tests: [site-pages.test.ts, site-reading.test.ts]
      - id: S01.2
        persona: visitor
        want: to browse framework, solutions, compliance, industries, resources and legal pages from a menu
        so_that: I can find the depth I need
        status: done
        acceptance:
          - Given any page, when I open the menu, then every section and its pages are listed, on desktop and phone.
          - Given an internal link or call to action in any page, when followed, then it resolves to a page (no 404).
        routes: [/framework, /solutions, /compliance, /industries, /resources, /about]
        tests: [site-pages.test.ts, app-routing.test.tsx]
      - id: S01.3
        persona: cro
        want: to read the compliance guides with clear limits on what VERITRAIL claims
        so_that: I do not mistake readiness support for certification
        status: done
        acceptance:
          - Given a compliance page, when it loads, then the standard disclaimer is shown and mappings are described as indicative.
          - Given the content checks, when run, then prohibited claims (certify, guarantee compliance) are not present.
        routes: [/compliance/eu-ai-act, /compliance/nist-ai-rmf, /compliance/iso-42001, /compliance/gap-analysis]
        tests: [platform-content-checks.test.ts]
      - id: S01.4
        persona: visitor
        want: long pages broken into scannable parts
        so_that: I can read 1,000-word pages without losing my place
        status: done
        capabilities: [CAP-074, CAP-073]
        acceptance:
          - Given a page with three or more sections, when it loads, then an "On this page" list highlights the current section.
          - Given bold-led lists, numbered steps, tables, code and FAQs, when rendered, then they appear as cards, timelines, stacked tables on phones, copyable code and accordions.
          - Given a control ID or glossary term in text, when shown, then it links to its control or shows its definition.
        routes: [/solutions/shield]
        tests: [site-reading.test.ts]
      - id: S01.5
        persona: visitor
        want: to share a page and see a relevant preview card
        so_that: colleagues know what I am sending them
        status: done
        capabilities: [CAP-075]
        acceptance:
          - Given a page in a section with a share image, when its head is rendered, then og:image and twitter:image are absolute URLs to that section's 1200×630 image.
          - Given an indexable page, when its head is rendered, then a canonical link and og:url give the same absolute URL as the sitemap; noindex pages have none.
        tests: [site-reading.test.ts]

