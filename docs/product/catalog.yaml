      - id: S06.2
        persona: gov-lead
        want: to search, filter and export the inventory
        so_that: I can answer "what AI do we run" with evidence
        status: done
        acceptance:
          - Given filters, when applied, then counts by tier and status update.
          - Given "Export view", when chosen, then a CSV of the filtered view downloads with formula-injection protection.
        routes: [/inventory]
        tests: [inventory-export.test.ts]

  - id: E07
    title: Guardrails design in the workspace
    area: assess
    goal: Choose the workspace risk tier and the runtime controls in place, with coverage of the required set.
    status: live
    stories:
      - id: S07.1
        persona: ciso
        want: to switch 21 guardrails on or off across seven groups and see required coverage for the tier
        so_that: I know which runtime controls are missing
        status: done
        acceptance:
          - Given tier Low, Medium or High, when chosen, then 6, 18 or 21 controls are required and coverage is enabled required ÷ required.
          - Given the tier changes, when saved, then gate floors and gap priorities change with it.
        routes: [/guardrails]
        tests: [governance.test.ts]
        gaps: ['"Export guardrail bundle" links to the general export; there is no guardrail-specific file.']

  - id: E08
    title: Operational governance registers
    area: operate
    goal: Run AI incidents, governance decisions, change reviews, monitoring and corrective actions with lifecycle rules and history.
    status: live
    stories:
      - id: S08.1
        persona: owner
        want: to log an AI incident or near miss and move it through triage to closure
        so_that: every incident has an owner and a history
        status: done
        acceptance:
          - Given an incident, when its status changes, then a timestamped history entry is added.
          - Given the register, when filtered, then active, resolved and closed incidents can be separated.
        routes: [/incidents]
        tests: [incidents.test.ts, incidents-ui.test.tsx]
      - id: S08.2
        persona: approver
        want: to record approvals, conditional approvals and time-bound risk acceptances per system
        so_that: decisions have a rationale and a review date
        status: done
        acceptance:
          - Given Risk accepted or Conditional approval, when saved, then a review date on or after the decision date is required.
          - Given a new decision for a system, when saved, then the previous current decision becomes Superseded.
          - Given a current record entered wrongly, when corrected with a reason and at least one changed field, then a new current record names it and the original stays in the register marked Corrected, with the reason in its history.
          - Given a current record made in error, when withdrawn with a reason, then it stays in the register marked Withdrawn and the system has no current decision.
          - Given corrected or withdrawn records, when evidence is exported, then the reasons appear in the history and the correction column.
        routes: [/decisions]
        tests: [decision-schema.test.ts, evidence-export.test.ts, decision-corrections.test.tsx]
        gaps: [A decision does not change the system's inventory status.]
      - id: S08.3
        persona: owner
        want: to submit a material change with impact ratings for review
        so_that: changes are screened before they ship
        status: done
        acceptance:
          - Given any impact rated High or Critical, when shown, then the review is flagged for escalation.
          - Given any impact Not assessed, when a reviewer tries to approve, then approval is not allowed and the screen says why.
        routes: [/changes]
        tests: [change-review.test.tsx, checklist.test.ts]
      - id: S08.4
        persona: engineer
        want: to define monitoring plans with thresholds and record observations
        so_that: breaches are visible and linked to incidents
        status: done
        acceptance:
          - Given an observation crossing the threshold, when recorded, then the plan shows Breach and links to the incident register.
          - Given a cadence, when an observation is recorded, then the next due date moves on, clamped to month ends.
        routes: [/monitoring]
        tests: [monitoring.test.ts, checklist.test.ts]
        gaps: [Observations are manual; there is no telemetry feed., Thresholds cannot be edited (pause and recreate).]
      - id: S08.5
        persona: owner
        want: to work a corrective action from start to verified closure
        so_that: fixes are evidenced and checked for effectiveness
        status: done
        acceptance:
          - Given In progress with completion evidence, when submitted, then the action is Pending verification.
          - Given Pending verification and a verification note, when closed, then who verified and when are recorded.
          - Given a move the rules refuse (no evidence, no finding), when attempted, then the screen says why and nothing changes.
          - Given Cancel action, when confirmed with a reason, then the action is Cancelled with the reason in its history; without a reason it is refused.
        routes: [/actions]
        tests: [corrective-actions.test.tsx]
        gaps: [Separation of duties is advisory text only.]

  - id: E09
    title: Remediation roadmap and lifecycle checklist
    area: assess
    goal: Turn gaps into a phased roadmap and show live readiness across the lifecycle.
    status: live
    stories:
      - id: S09.1
        persona: gov-lead
        want: to see remediation items in four phases, keep them up to date and mark them done
        so_that: progress is tracked against a plan that reflects reality
        status: done
        acceptance:
          - Given a gap added from the overview or gates, when added, then it lands in a phase by priority and effort and is not duplicated.
          - Given the add form, when I enter an action, effort, phase and optional owner, then the item appears in that phase, as Unassigned if no owner is given.
          - Given an item, when I edit it, then its action, owner, effort and phase (any of the four) can change; deleting it asks me to confirm.
        routes: [/roadmap]
        tests: [governance.test.ts, roadmap.test.tsx]
      - id: S09.2
        persona: gov-lead
        want: a lifecycle checklist derived from the workspace
        so_that: I see what needs action without re-entering data
        status: done
        acceptance:
          - Given the workspace, when the checklist loads, then each task is Complete, Action needed or not applicable, and progress excludes not-applicable tasks.
          - Given every open roadmap action has an owner, when checked, then "Assign owners" is Complete; one unowned open action makes it Action needed.
        routes: [/checklist]
        tests: [checklist.test.ts]

