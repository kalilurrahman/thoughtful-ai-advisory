name: AEGIS CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r requirements.txt
      - name: Content integrity & prohibited-claim scan
        run: make check
      - name: Build website (fails on broken links, unknown control IDs, a11y/SEO checks)
        run: make site
      - name: Test suite
        run: make test
      - name: Upload site artefact
        uses: actions/upload-artifact@v4
        with:
          name: aegis-site
          path: app/website/dist
