# Email templates used by the AEGIS API.
# Governance rule: external communications require human approval. Transactional
# templates are approved ONCE (approver + date recorded here, change-controlled via
# git review); the API refuses to send any template whose status is not "approved"
# with a complete approval record, and queues the message for human approval instead.
# Marketing/nurture templates are intentionally left "draft" until approved.
templates:
  maturity_report_delivery:
    version: 1.0.0
    status: approved
    purpose: Deliver the self-assessment report the recipient explicitly requested.
    approval:
      approved_by: "PLACEHOLDER — Head of Marketing (replace with named approver before launch)"
      approved_at: "2026-10-21"
      approval_ref: DEC-0007
    subject: "Your AEGIS AI Governance Maturity Report — {maturity_level} ({overall_score}/100)"
    body: |
      Hello {name},

      Thank you for completing the AEGIS AI Governance Maturity Self-Assessment.

      Overall score: {overall_score}/100 — {maturity_level}
      Your detailed report is attached (PDF and Markdown). You can also download it here:
      {report_url}

      Important: your results are self-reported (User-asserted) and indicative. They are not a
      certification or a determination of compliance with any law or standard.

      The fastest way to validate these findings with evidence is an AEGIS Governance Baseline:
      a fixed-scope 4–6 week engagement covering inventory, maturity validation, five deep-dive
      assessments, two agent reviews, a gap register and a remediation roadmap.
      Book a conversation: {baseline_url}

      — The AEGIS team

      You received this email because you requested your report. We will not send marketing email
      unless you opted in. Privacy notice: {privacy_url}
  form_acknowledgement:
    version: 1.0.0
    status: approved
    purpose: Acknowledge a contact, demo or Baseline request submitted by the recipient.
    approval:
      approved_by: "PLACEHOLDER — Head of Marketing (replace with named approver before launch)"
      approved_at: "2026-10-21"
      approval_ref: DEC-0007
    subject: "We received your AEGIS {form_label} request"
    body: |
      Hello {name},

      Thanks for your {form_label} request. A member of the AEGIS team will reply within two business days.

      — The AEGIS team

      Privacy notice: {privacy_url}
  nurture_day3_followup:
    version: 0.1.0
    status: draft
    purpose: Marketing follow-up three days after report delivery (opt-in only).
    approval: {}
    subject: "Three quick wins from your AEGIS maturity report"
    body: |
      Hello {name}, ...
