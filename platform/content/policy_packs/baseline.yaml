# VERITRAIL Runtime Policy Pack — Baseline
# ---------------------------------------------------------------------------
# Minimum runtime guardrails for ANY LLM application or agent. Industry/use-case
# packs start from this baseline and add tool rules and tighter limits.
#
# Template status: draft. A pack is a starting point, not an approved policy:
# copy it, set applies_to for your agent, review it, and obtain the human
# approvals listed under `approval` before moving beyond observe mode.
# VERITRAIL supports readiness and evidence; it does not certify compliance.
# ---------------------------------------------------------------------------
schema_version: veritrail.policy/v1
policy_id: pack-baseline
policy_name: VERITRAIL Baseline Runtime Policy
description: >-
  Default-deny tool access, PII redaction, prompt-injection and jailbreak
  detection, rate/budget limits, immutable decision logging and a kill switch
  for any LLM application or agent. Contains no tool allow rules: every tool
  must be explicitly declared in a derived policy.
version: 1.0.0
status: draft
owner: AI Platform Security
applies_to:
  agent_name: ["*"]
  environment: ["*"]
  risk_tier: ["*"]
  tenant: ["*"]
  model: ["*"]
rollout:
  mode: observe
  exit_criteria:
    - Representative traffic evaluated and the would-be decision distribution reviewed by the system owner
    - Sampled would-be DENY decisions reviewed; false-positive rate below the agreed threshold
    - Every legitimate tool in observed traffic is covered by an explicit rule (no legitimate default-deny hits)
  notes: Promote observe -> warn -> protect -> enforce only through an approved new policy version.
identity:
  required: true
  required_claims: [sub, tenant_id, roles]
  tenant_binding: true
tools:
  default_action: DENY
  deny_list: []
  rules: []
content:
  max_input_chars: 32000
  pii_redaction:
    enabled: true
    entities: [email, payment_card, iban, us_ssn, uk_nino, india_pan, india_aadhaar, phone, ip_address, api_key]
    apply_to: [prompt, response, tool_params, tool_output]
    action: REDACT
  prompt_injection:
    enabled: true
    apply_to: [prompt, tool_output, tool_params]
    action: DENY
    decode_obfuscation: true
  jailbreak:
    enabled: true
    apply_to: [prompt]
    action: DENY
    decode_obfuscation: true
  transforms:
    - id: transform.truncate_response
      type: truncate
      apply_to: [response]
      max_chars: 16000
limits:
  requests_per_minute: 60
  tool_calls_per_session: 25
  tokens_per_day: 1000000
  cost_per_month_usd: 2000
  action_on_breach: RATE_LIMIT
  alert_at_percent: 80
logging:
  immutable_audit: true
  prompt_logging: redacted
  response_logging: redacted
  tool_param_logging: redacted
  sink: veritrail_common.audit.AuditLog (hash-chained JSONL); ship to WORM storage in production
kill_switch:
  enabled: true
  engaged: false
  scopes: [agent, tool, model, tenant]
  engaged_targets: []
  authorized_roles: [Security Operations Lead, AI System Owner, SRE On-call]
  target_time_to_disable_minutes: 15
rollback:
  previous_version: null
  strategy: disable
  triggers:
    - Confirmed prompt-injection-driven tool misuse
    - Sensitive data observed in a response or log
    - Sustained false-positive rate above threshold after promotion
shadow_mode:
  enabled: true
  evaluate_as: enforce
evidence_retention_days: 365
approval:
  required_approver_roles: [AI System Owner, Security Lead]
  min_approvers: 2
  separation_of_duties: true
  approved_by: []
  approved_at: null
escalation:
  queue: ai-security-review
  contact_role: Security Operations Lead
change_history:
  - version: 1.0.0
    date: "2026-10-21"
    author: VERITRAIL Governance Content Lead
    change_type: created
    summary: Initial baseline pack.
citations: [IS-04, IS-11, IS-12, IS-14, IS-15, IS-16, SE-08, EI-07, GL-04]
metadata:
  pack: baseline
  evidence_status: Inferred
  intended_use: Starting point for any LLM application or agent runtime policy.
  notice: >-
    Template only. Requires review, tailoring and recorded human approval before
    use beyond observe mode. Detection is heuristic; see docs/RUNTIME_SHIELD_DESIGN.md.
