# Synthetic example — fictional organization and system generated by VERITRAIL for illustration.
# VERITRAIL runtime policy pol-northwind-support-agent v0.1.0 (status: draft)
# Draft policies require review and recorded human approval before activation.
schema_version: veritrail.policy/v1
policy_id: pol-northwind-support-agent
policy_name: Northwind Support Assistant — Runtime Policy
description: 'Draft runtime policy generated by VERITRAIL for Northwind Support Assistant (Answer customer order
  and delivery questions, update tickets, and issue small goodwill refunds). Overall runtime risk: High (Inferred).
  Review before rollout.'
version: 0.1.0
status: draft
owner: Head of Customer Service
applies_to:
  agent_name:
  - northwind-support-agent
  environment:
  - production
  risk_tier:
  - Medium
  tenant:
  - northwind
  model:
  - gpt-4o-2024-08-06
rollout:
  mode: observe
  exit_criteria:
  - At least 5,000 representative requests evaluated
  - Would-be decision distribution reviewed by the system owner and security
  - Sampled would-be blocks reviewed; false-positive rate < 3%
  - Every legitimate tool seen in traffic has an explicit rule (no legitimate default-deny hits)
  - Limits calibrated from observed peaks
  notes: Each promotion is a new policy version that goes draft → in_review → approved → active with recorded human
    approval. VERITRAIL never promotes or activates a policy on its own.
identity:
  required: true
  required_claims:
  - sub
  - tenant_id
  - roles
  allowed_roles:
  - support_agent
  - customer
  tenant_binding: true
tools:
  default_action: DENY
  deny_list: []
  rules:
  - id: tool.crm-lookup-order
    tool: crm.lookup_order
    operation: read
    action: ALLOW
    description: 'read access to personal data: restrict to tenant- and record-scoped queries'
    scopes:
    - crm-lookup-order:read
    parameters:
      order_id:
        type: string
        regex: ^ORD-[0-9]{6,10}$
        required: true
    additional_parameters: false
    citations:
    - IS-11
    - EI-07
  - id: tool.kb-search
    tool: kb.search
    operation: read
    action: ALLOW
    description: read-only access to low-sensitivity data
    scopes:
    - kb-search:read
    parameters:
      query:
        type: string
        max_length: 500
        required: true
    additional_parameters: false
    citations:
    - IS-11
    - EI-07
  - id: tool.tickets-update
    tool: tickets.update
    operation: write
    action: ALLOW
    description: 'state-changing action: allowed only within validated parameters and scoped credentials'
    scopes:
    - tickets-update:write
    parameters:
      ticket_id:
        type: string
        regex: ^TCK-[0-9]{6,10}$
        required: true
      status:
        type: string
        enum:
        - open
        - pending_customer
        - resolved
      note:
        type: string
        max_length: 4000
    additional_parameters: false
    citations:
    - IS-11
    - IS-12
    - EI-07
    max_calls_per_session: 20
  - id: tool.payments-issue-refund
    tool: payments.issue_refund
    operation: payment
    action: ALLOW
    description: payments up to 50 within validated limits; above that, human approval
    scopes:
    - payments-issue-refund:payment
    parameters:
      order_id:
        type: string
        regex: ^ORD-[0-9]{6,10}$
        required: true
      amount:
        type: number
        min: 0.01
        required: true
        max: 500
      currency:
        type: string
        enum:
        - USD
        - EUR
        - GBP
        required: true
      reason_code:
        type: string
        enum:
        - late_delivery
        - damaged_item
        - goodwill
        required: true
    additional_parameters: false
    citations:
    - IS-11
    - IS-13
    - IS-16
    - EI-07
    require_approval_if:
    - param: amount
      op: gt
      value: 50
      reason: amount above auto-approval threshold 50
    approval_roles:
    - Support Team Lead
    max_calls_per_session: 5
  - id: tool.email-send-customer-reply
    tool: email.send_customer_reply
    operation: external_send
    action: ALLOW
    description: external send restricted to bound recipients / allow-listed domains
    scopes:
    - email-send-customer-reply:external_send
    parameters:
      ticket_id:
        type: string
        regex: ^TCK-[0-9]{6,10}$
        required: true
      reply_via:
        type: string
        required: true
        domain_allow_list:
        - mail.northwind.example
      body:
        type: string
        max_length: 6000
        required: true
    additional_parameters: false
    citations:
    - IS-11
    - IS-13
    - IS-04
    - EI-07
    max_calls_per_session: 10
    allow_pii_entities:
    - email
  - id: tool.crm-delete-customer
    tool: crm.delete_customer
    operation: delete
    action: REQUIRE_HUMAN_APPROVAL
    description: irreversible deletion requires designated human approval of the exact action
    scopes:
    - crm-delete-customer:delete
    parameters:
      customer_id:
        type: string
        regex: ^CUS-[0-9]{6,10}$
        required: true
      erasure_request_id:
        type: string
        regex: ^DSR-[0-9]{6}$
        required: true
    additional_parameters: false
    citations:
    - IS-11
    - IS-13
    - IS-15
    - EI-07
    approval_roles:
    - Data Protection Officer
    max_calls_per_session: 3
content:
  max_input_chars: 16000
  pii_redaction:
    enabled: true
    entities:
    - email
    - phone
    - payment_card
    - iban
    - us_ssn
    - uk_nino
    - india_pan
    - india_aadhaar
    - ip_address
    - api_key
    apply_to:
    - prompt
    - response
    - tool_params
    - tool_output
    action: REDACT
  prompt_injection:
    enabled: true
    apply_to:
    - prompt
    - tool_output
    - tool_params
    action: DENY
    decode_obfuscation: true
  jailbreak:
    enabled: true
    apply_to:
    - prompt
    action: DENY
    decode_obfuscation: true
  transforms:
  - id: transform.truncate_response
    type: truncate
    apply_to:
    - response
    max_chars: 16000
  - id: transform.ai_disclosure
    type: append_disclosure
    apply_to:
    - response
    text: This response was generated with AI assistance.
  - id: transform.strip_unapproved_urls
    type: strip_unapproved_urls
    apply_to:
    - response
    domain_allow_list:
    - northwind.example
    - help.northwind.example
limits:
  requests_per_minute: 30
  tool_calls_per_session: 20
  tokens_per_day: 500000
  cost_per_month_usd: 3000
  action_on_breach: RATE_LIMIT
  alert_at_percent: 80
logging:
  immutable_audit: true
  prompt_logging: redacted
  response_logging: redacted
  tool_param_logging: redacted
  sink: veritrail_common.audit.AuditLog (hash-chained JSONL); ship to WORM storage in production
kill_switch:
  enabled: true
  engaged: false
  scopes:
  - agent
  - tool
  - model
  - tenant
  engaged_targets: []
  authorized_roles:
  - Security Operations Lead
  - AI System Owner
  - SRE On-call
  target_time_to_disable_minutes: 5
rollback:
  previous_version: null
  strategy: disable
  triggers:
  - Injection detected in a prompt or tool output that reached a tool call
  - Sensitive data observed in a response, outbound message or log
  - Unauthorized or anomalous tool call (default-deny spike, scope violation, parameter violations)
  - Rate/budget limit breaches or loop behaviour
  - Model vendor outage, unannounced model change or vendor security incident
shadow_mode:
  enabled: true
  evaluate_as: enforce
evidence_retention_days: 730
approval:
  required_approver_roles:
  - AI System Owner
  - Security Lead
  - Risk & Compliance Lead
  min_approvers: 3
  separation_of_duties: true
  approved_by: []
  approved_at: null
escalation:
  queue: ai-security-review
  contact_role: Security Operations Lead
change_history:
- version: 0.1.0
  date: '2026-10-21'
  author: VERITRAIL Runtime Shield Advisor (automated draft)
  change_type: created
  summary: Initial draft generated from the Runtime Shield Advisor profile; requires human review.
citations:
- EI-07
- GL-04
- IS-04
- IS-08
- IS-11
- IS-12
- IS-13
- IS-14
- IS-15
- IS-16
- SE-08
metadata:
  generated_by: veritrail_shield.generator
  advisor_version: 1.0.0
  evidence_status: Inferred
  overall_risk: High
  requires_human_approval: true
  synthetic: true
  denied_tools: []
  notice: 'Draft generated by VERITRAIL. VERITRAIL does not activate policies: promotion beyond draft/observe requires
    review and recorded human approval. Detection is heuristic.'
