# Synthetic example — fictional organization and system generated by VERITRAIL for illustration.
# VERITRAIL runtime policy pol-contoso-ap-agent v0.1.0 (status: draft)
# Draft policies require review and recorded human approval before activation.
schema_version: veritrail.policy/v1
policy_id: pol-contoso-ap-agent
policy_name: Contoso AP Automation Agent — Runtime Policy
description: 'Draft runtime policy generated by VERITRAIL for Contoso AP Automation Agent (Match supplier invoices
  to purchase orders, prepare payment runs and draft remittance advice). Overall runtime risk: High (Inferred).
  Review before rollout.'
version: 0.1.0
status: draft
owner: Financial Controller
applies_to:
  agent_name:
  - contoso-ap-agent
  environment:
  - production
  risk_tier:
  - High
  tenant:
  - contoso
  model:
  - claude-sonnet-4
rollout:
  mode: observe
  exit_criteria:
  - At least 5,000 representative requests evaluated
  - Would-be decision distribution reviewed by the system owner and security
  - Sampled would-be blocks reviewed; false-positive rate < 3%
  - Every legitimate tool seen in traffic has an explicit rule (no legitimate default-deny hits)
  - Limits calibrated from observed peaks
  notes: Each promotion is a new policy version that goes draft → in_review → approved → active with recorded human
    approval. VERITRAIL never promotes or activates a policy on its own.
identity:
  required: true
  required_claims:
  - sub
  - tenant_id
  - roles
  allowed_roles:
  - ap_clerk
  - finance_controller
  tenant_binding: true
tools:
  default_action: DENY
  deny_list: []
  rules:
  - id: tool.erp-get-invoice
    tool: erp.get_invoice
    operation: read
    action: ALLOW
    description: 'read access to personal data: restrict to tenant- and record-scoped queries'
    scopes:
    - erp-get-invoice:read
    parameters:
      invoice_id:
        type: string
        regex: ^INV-[0-9]{8}$
        required: true
    additional_parameters: false
    citations:
    - IS-11
    - EI-07
  - id: tool.erp-match-po
    tool: erp.match_po
    operation: write
    action: ALLOW
    description: 'state-changing action: allowed only within validated parameters and scoped credentials'
    scopes:
    - erp-match-po:write
    parameters:
      invoice_id:
        type: string
        regex: ^INV-[0-9]{8}$
        required: true
      po_number:
        type: string
        regex: ^PO-[0-9]{8}$
        required: true
    additional_parameters: false
    citations:
    - IS-11
    - IS-12
    - EI-07
    max_calls_per_session: 20
  - id: tool.payments-schedule-payment
    tool: payments.schedule_payment
    operation: payment
    action: REQUIRE_HUMAN_APPROVAL
    description: 'payments are high-impact and irreversible: every call requires human approval'
    scopes:
    - payments-schedule-payment:payment
    parameters:
      invoice_id:
        type: string
        regex: ^INV-[0-9]{8}$
        required: true
      amount:
        type: number
        min: 0.01
        required: true
        max: 250000
      currency:
        type: string
        enum:
        - USD
        - EUR
        required: true
      payee_iban:
        type: string
        max_length: 34
        required: true
    additional_parameters: false
    citations:
    - IS-11
    - IS-13
    - IS-16
    - EI-07
    approval_roles:
    - Finance Controller
    max_calls_per_session: 5
    allow_pii_entities:
    - iban
  - id: tool.vendor-master-update-bank-details
    tool: vendor_master.update_bank_details
    operation: write
    action: REQUIRE_HUMAN_APPROVAL
    description: 'state-changing action: allowed only within validated parameters and scoped credentials; user-specified:
      every call requires human approval'
    scopes:
    - vendor-master-update-bank-details:write
    parameters:
      vendor_id:
        type: string
        regex: ^V-[0-9]{6}$
        required: true
      new_iban:
        type: string
        max_length: 34
        required: true
      verification_ticket:
        type: string
        regex: ^VRF-[0-9]{6}$
        required: true
    additional_parameters: false
    citations:
    - IS-11
    - IS-12
    - EI-07
    approval_roles:
    - Finance Controller
    max_calls_per_session: 1
    allow_pii_entities:
    - iban
  - id: tool.email-send-remittance
    tool: email.send_remittance
    operation: external_send
    action: REQUIRE_HUMAN_APPROVAL
    description: 'external communication leaves the organization: human approval before sending'
    scopes:
    - email-send-remittance:external_send
    parameters:
      to:
        type: string
        required: true
      invoice_id:
        type: string
        regex: ^INV-[0-9]{8}$
        required: true
      body:
        type: string
        max_length: 4000
    additional_parameters: false
    citations:
    - IS-11
    - IS-13
    - IS-04
    - EI-07
    approval_roles:
    - AP Supervisor
    max_calls_per_session: 10
    allow_pii_entities:
    - email
  - id: tool.reports-export-ledger
    tool: reports.export_ledger
    operation: export
    action: REQUIRE_HUMAN_APPROVAL
    description: bulk data export requires designated human approval and row limits
    scopes:
    - reports-export-ledger:export
    parameters:
      period:
        type: string
        regex: ^[0-9]{4}-[0-9]{2}$
        required: true
      max_rows:
        type: integer
        min: 1
        max: 5000
    additional_parameters: false
    citations:
    - IS-11
    - IS-13
    - IS-04
    - IS-03
    - EI-07
    approval_roles:
    - Finance Controller
    max_calls_per_session: 2
content:
  max_input_chars: 16000
  pii_redaction:
    enabled: true
    entities:
    - email
    - phone
    - payment_card
    - iban
    - us_ssn
    - uk_nino
    - india_pan
    - india_aadhaar
    - ip_address
    - api_key
    apply_to:
    - prompt
    - response
    - tool_params
    - tool_output
    action: REDACT
  prompt_injection:
    enabled: true
    apply_to:
    - prompt
    - tool_output
    - tool_params
    action: DENY
    decode_obfuscation: true
  jailbreak:
    enabled: true
    apply_to:
    - prompt
    action: DENY
    decode_obfuscation: true
  transforms:
  - id: transform.truncate_response
    type: truncate
    apply_to:
    - response
    max_chars: 16000
limits:
  requests_per_minute: 30
  tool_calls_per_session: 20
  tokens_per_day: 500000
  cost_per_month_usd: 4000
  action_on_breach: RATE_LIMIT
  alert_at_percent: 80
logging:
  immutable_audit: true
  prompt_logging: redacted
  response_logging: redacted
  tool_param_logging: redacted
  sink: veritrail_common.audit.AuditLog (hash-chained JSONL); ship to WORM storage in production
kill_switch:
  enabled: true
  engaged: false
  scopes:
  - agent
  - tool
  - model
  - tenant
  engaged_targets: []
  authorized_roles:
  - Security Operations Lead
  - AI System Owner
  - SRE On-call
  target_time_to_disable_minutes: 5
rollback:
  previous_version: null
  strategy: disable
  triggers:
  - Injection detected in a prompt or tool output that reached a tool call
  - Sensitive data observed in a response, outbound message or log
  - Unauthorized or anomalous tool call (default-deny spike, scope violation, parameter violations)
  - Rate/budget limit breaches or loop behaviour
  - Model vendor outage, unannounced model change or vendor security incident
shadow_mode:
  enabled: true
  evaluate_as: enforce
evidence_retention_days: 730
approval:
  required_approver_roles:
  - AI System Owner
  - Security Lead
  - Risk & Compliance Lead
  min_approvers: 3
  separation_of_duties: true
  approved_by: []
  approved_at: null
escalation:
  queue: ai-security-review
  contact_role: Security Operations Lead
change_history:
- version: 0.1.0
  date: '2026-10-21'
  author: VERITRAIL Runtime Shield Advisor (automated draft)
  change_type: created
  summary: Initial draft generated from the Runtime Shield Advisor profile; requires human review.
citations:
- EI-07
- GL-04
- IS-03
- IS-04
- IS-11
- IS-12
- IS-13
- IS-14
- IS-15
- IS-16
- SE-08
metadata:
  generated_by: veritrail_shield.generator
  advisor_version: 1.0.0
  evidence_status: Inferred
  overall_risk: High
  requires_human_approval: true
  synthetic: true
  denied_tools: []
  notice: 'Draft generated by VERITRAIL. VERITRAIL does not activate policies: promotion beyond draft/observe requires
    review and recorded human approval. Detection is heuristic.'
